name: Publish frozen OSM input

on:
  push:
    branches:
      - codex/stage-2b-prg-road-graph
    paths:
      - .github/workflows/publish-frozen-osm.yml

permissions:
  contents: write

jobs:
  publish:
    name: Verify and publish Poland 2026-09-01 PBF
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASSET: poland-260901.osm.pbf
      EXPECTED_SIZE: 2091448485
      EXPECTED_MD5: 0db66b478a3ed7c6f52d182e13c6fa27
      RELEASE_TAG: frozen-osm-2026-09-01
      SOURCE_URL: https://download.geofabrik.de/europe/poland-260901.osm.pbf
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download exact dated snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-delay 5 \
            --output "$ASSET" "$SOURCE_URL"
          test "$(stat --format='%s' "$ASSET")" = "$EXPECTED_SIZE"
          test "$(md5sum "$ASSET" | awk '{print $1}')" = "$EXPECTED_MD5"
          sha256sum "$ASSET" | tee "${ASSET}.sha256"

      - name: Create immutable input release
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256="$(awk '{print $1}' "${ASSET}.sha256")"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Frozen OSM input: Poland 2026-09-01" \
            --notes "Immutable Geofabrik Poland snapshot. Size: ${EXPECTED_SIZE} bytes. MD5: ${EXPECTED_MD5}. SHA-256: ${sha256}. Source: ${SOURCE_URL}"
          gh release upload "$RELEASE_TAG" "$ASSET" "${ASSET}.sha256" \
            --repo "$GITHUB_REPOSITORY"
          {
            echo "### Frozen OSM input published"
            echo "- Asset: ${ASSET}"
            echo "- Size: ${EXPECTED_SIZE} bytes"
            echo "- MD5: ${EXPECTED_MD5}"
            echo "- SHA-256: ${sha256}"
          } >> "$GITHUB_STEP_SUMMARY"
