name: Dispatch Stage 2A clean rebuild

on:
  push:
    branches:
      - codex/stage-2a-road-graph
    paths:
      - .github/workflows/dispatch-road-graph-rebuild.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch clean rebuild workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/road-graph-rebuild-check.yml/dispatches" \
            --data '{"ref":"codex/stage-2a-road-graph"}'
