name: PRG Stage 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/prg-stage.yml"
      - "input/prg/**"
      - "instance/pl_18_capitals_static_instance_v1.yaml"
      - "results/prg/**"
      - "scripts/prg_stage.py"
      - "scripts/prg_stage.sh"
      - "scripts/validate_prg_stage.py"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/prg-stage.yml"
      - "input/prg/**"
      - "instance/pl_18_capitals_static_instance_v1.yaml"
      - "results/prg/**"
      - "scripts/prg_stage.py"
      - "scripts/prg_stage.sh"
      - "scripts/validate_prg_stage.py"

permissions:
  contents: read

concurrency:
  group: prg-stage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prg-stage:
    name: Extract and validate PRG boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install GIS runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdal-bin python3-gdal
          /usr/bin/python3 -c 'from osgeo import gdal, ogr; print("GDAL " + gdal.VersionInfo("RELEASE_NAME") + "; GEOS " + ".".join(str(value) for value in (ogr.GetGEOSVersionMajor(), ogr.GetGEOSVersionMinor(), ogr.GetGEOSVersionMicro())))'

      - name: Extract official PRG boundaries
        shell: bash
        env:
          PYTHON_BIN: /usr/bin/python3
        run: bash scripts/prg_stage.sh

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f results/prg/validation-report.md ]]; then
            cat results/prg/validation-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact PRG evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: prg-stage-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
          path: |
            input/prg/DescribeFeatureType.xml
            results/prg/SHA256SUMS
            results/prg/prg-18-raw.gml
            results/prg/prg-18-original.gpkg
            results/prg/prg-18-computational.gpkg
            results/prg/prg-18.geojson
            results/prg/prg-city-inventory.csv
            results/prg/prg-city-inventory.json
            results/prg/validation-report.md
