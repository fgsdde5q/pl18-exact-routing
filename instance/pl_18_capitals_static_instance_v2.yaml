    - preserve_Stage_1_city_start_and_geometry_semantics
  created_at: '2026-07-26T17:08:29Z'
  timezone: Europe/Warsaw

problem:
  objective: minimum_static_travel_time
  return_to_start: false
  free_finish: true
  start_city_visited: Warszawa
  dynamic_factors: forbidden

start:
  name: Plac Wilsona, Warszawa
  wgs84:
    longitude: 20.986450
    latitude: 52.268850
  inside_city_bit_index: 0
  snap:
    crs: EPSG:2180
    eligible: public_motorcar_directed_segments_only
    method: nearest_orthogonal_projection
    max_distance_m: 150.0
    distance_rounding_m: 0.001
    tie_break:
      - distance_millimetres
      - osm_way_id
      - osm_segment_ordinal
      - direction_bit
  departure_heading:
    policy: free_legal_departure
    implementation: zero_cost_super_source_to_all_legal_directions_on_selected_physical_segment

